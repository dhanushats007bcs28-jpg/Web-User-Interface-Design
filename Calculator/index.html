
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <header class="header">
            <div>
                <h1>Calculator</h1>
                <p>Simple and smart calculations</p>
            </div>
            <button id="themeBtn" class="theme-btn" aria-label="Toggle theme">☀</button>
        </header>

        <section class="display">
            <div id="expression" class="expression"></div>
            <div id="display" class="result">0</div>
        </section>

        <section class="buttons">
            <button class="special" data-action="clear">AC</button>
            <button class="special" data-action="sign">+/−</button>
            <button class="special" data-action="percent">%</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button class="special" data-action="backspace">⌫</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="equals">=</button>
        </section>

        <footer>Supports mouse and keyboard input</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
